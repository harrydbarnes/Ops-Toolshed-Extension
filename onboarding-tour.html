<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ops Toolshed Tour</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="onboarding-tour.css">
</head>
<body>
    <main class="tour-shell">
        <header class="tour-header">
            <div class="tour-brand"><img src="icon.png" alt=""><span>Ops Toolshed tour</span></div>
            <button id="skip-tour" type="button">Skip</button>
        </header>
        <div class="tour-progress" aria-hidden="true"><span id="tour-progress-fill"></span></div>
        <section class="tour-content" aria-live="polite">
            <p id="tour-section" class="tour-section"></p>
            <h1 id="tour-title"></h1>
            <p id="tour-description" class="tour-description"></p>
            <div id="tour-tip" class="tour-tip"></div>
            <button id="tour-popup-action" class="tour-inline-action" type="button" hidden>Open Ops Toolshed popup</button>
            <p id="tour-status" class="tour-status" role="status"></p>
        </section>
        <footer class="tour-footer">
            <button id="tour-back" class="tour-secondary" type="button">Back</button>
            <button id="tour-next" class="tour-primary" type="button">Next</button>
        </footer>
    </main>
    <script src="onboarding-tour.js"></script>
</body>
</html>
