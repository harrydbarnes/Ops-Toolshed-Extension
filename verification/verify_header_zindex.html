<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Header Z-Index</title>
    <link rel="stylesheet" href="../content.css">
    <style>
        /* Mock environment */
        body {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Verify Header Z-Index</h1>

    <div id="ptb-header">
        Header Content
    </div>

    <div id="status" style="margin-top: 20px; font-weight: bold;">Waiting...</div>

    <script>
        setTimeout(() => {
            const header = document.getElementById('ptb-header');
            const style = window.getComputedStyle(header);
            const statusDiv = document.getElementById('status');

            const zIndex = style.zIndex;
            const position = style.position;

            console.log(`Z-Index: ${zIndex}, Position: ${position}`);

            if (zIndex === '10001' && position === 'relative') {
                statusDiv.textContent = "Success: Z-Index is 10001 and Position is relative.";
                statusDiv.style.color = "green";
            } else {
                statusDiv.textContent = `Failure: Expected z-index 10001 (got ${zIndex}) and position relative (got ${position}).`;
                statusDiv.style.color = "red";
            }
        }, 500);
    </script>
</body>
</html>
