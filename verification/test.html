<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading Facts Test</title>
    <link rel="stylesheet" href="../content.css">
    <style>
        body {
            background-color: #f0f0f0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Shadow DOM spinner container - Centered to match toast logic logic assumption */
        /* Actually, let's keep it static but ensure logic handles it.
           The toast logic calculates center based on rect.
           If the test fails, it might be because the spinner is at 20,20
           but the toast is fixed centered to screen or similar.

           Wait, content.css has transform: translateX(-50%) and left is set by JS.
           In test.html, body is flex centered, but #spinner-container is absolute top:20 left:20.
           The toast should move to left: 20 + width/2.

           Let's move the spinner to the center of the screen to make alignment obvious and consistent.
        */
        #spinner-container {
            /* Position in center */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <!-- Shadow DOM Host for spinner -->
    <div id="spinner-container"></div>

    <script src="../utils.js"></script>
    <script>
        // Mock chrome.storage.sync
        window.chrome = {
            storage: {
                sync: {
                    get: (keys, callback) => {
                        // Mock enabled by default
                        callback({ loadingFactsEnabled: true });
                    }
                },
                local: {
                    get: (keys, callback) => {
                        // Mock user stats for dynamic fact testing
                        callback({
                            prismaUserStats: {
                                totalLoadingTime: 3665 // 1h 1m 5s
                            }
                        });
                    }
                },
                onChanged: {
                    addListener: () => {}
                }
            },
            runtime: {
                getURL: (path) => {
                    // Return relative path for test environment
                    return '../' + path;
                }
            }
        };

        // Create Shadow DOM and add spinner matching new logic
        const container = document.getElementById('spinner-container');
        const shadow = container.attachShadow({mode: 'open'});

        // Wrap spinner in a DIV so 'parentElement' exists inside Shadow DOM
        const wrapper = document.createElement('div');
        wrapper.id = 'spinner-wrapper';
        wrapper.style.display = 'inline-block'; // Mimic typical spinner container behavior

        const spinner = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        spinner.setAttribute('class', 'spinner');
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '25');
        circle.setAttribute('cy', '25');
        circle.setAttribute('r', '20');
        circle.setAttribute('fill', 'none');
        circle.setAttribute('stroke-width', '5');
        spinner.appendChild(circle);

        wrapper.appendChild(spinner);
        shadow.appendChild(wrapper);

        // Add the specific VP block spinner to test the new selector
        // This simulates the structure: div#vp-block > i.fa.fa-circle-o-notch.fa-spin
        const vpBlock = document.createElement('div');
        vpBlock.id = 'vp-block';
        // Initially visible
        vpBlock.style.display = 'block';
        vpBlock.style.width = '50px';
        vpBlock.style.height = '50px';

        const faSpinner = document.createElement('i');
        faSpinner.className = 'fa fa-circle-o-notch fa-spin';
        faSpinner.style.display = 'block';
        faSpinner.style.width = '20px';
        faSpinner.style.height = '20px'; // Ensure dimensions > 0 for visibility check

        vpBlock.appendChild(faSpinner);
        document.body.appendChild(vpBlock);

    </script>
    <script src="../features/loading-facts.js"></script>
    <script>
        // Manually trigger initialization
        if (window.loadingFactsFeature) {
            window.loadingFactsFeature.initialize();
            // Force check
            window.loadingFactsFeature.checkForLoading();
        }
    </script>
</body>
</html>
