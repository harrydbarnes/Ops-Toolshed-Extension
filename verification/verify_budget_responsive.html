<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Responsive Budget</title>
    <link rel="stylesheet" href="../content.css">
    <style>
        body { padding: 20px; }
        .campaign-budget-overview-value { display: inline-block; }
    </style>
</head>
<body>
    <h1>Verify Responsive Budget</h1>

    <div id="campaign-budget-overview-container">
        <div class="progress-bar" role="progressbar" title="Buy Total: £29,999.99"></div>
        <span class="campaign-budget-overview-value">£60,000</span>
    </div>

    <!-- Toolbar for visibility test -->
    <div id="mo-extracted-actions-toolbar">Toolbar</div>

    <div id="status" style="margin-top: 20px; font-weight: bold;">Waiting...</div>

    <script>
        // Mock Chrome API
        window.chrome = {
            runtime: { id: 'mock-id', lastError: null },
            storage: {
                sync: {
                    get: function(keys, callback) {
                        callback({
                            campaignNavStyle: 'new',
                            optimisedNewNavEnabled: true
                        });
                    },
                    set: function(data, callback) { if (callback) callback(); }
                },
                onChanged: { addListener: function(callback) {} }
            }
        };
    </script>
    <script src="../features/campaign.js"></script>

    <script>
        setTimeout(() => {
            const statusDiv = document.getElementById('status');

            // Trigger logic
            if (window.campaignFeature && window.campaignFeature.handleCampaignNavigationOptimisation) {
                window.campaignFeature.handleCampaignNavigationOptimisation();
            }

            // Verify DOM Injection
            const expanded = document.querySelector('.budget-expanded');
            const compact = document.querySelector('.budget-compact');
            const container = document.getElementById('campaign-budget-overview-container');
            const originalText = container.querySelector('.campaign-budget-overview-value');

            let success = true;
            let msg = [];

            if (!expanded || expanded.textContent !== "£29,999.99 / £60,000") {
                success = false;
                msg.push(`Expanded text incorrect. Got: ${expanded ? expanded.textContent : 'null'}`);
            }

            if (!compact || compact.textContent !== "£60k") {
                success = false;
                msg.push(`Compact text incorrect. Got: ${compact ? compact.textContent : 'null'}`);
            }

            // Check test case for rounding
            const testRounded = window.campaignFeature ? window.campaignFeature.formatCompactCurrency ? window.campaignFeature.formatCompactCurrency("£1,100,000") : null : null;
            // Note: Since formatCompactCurrency is not exported directly in the window object from my previous edits,
            // I can't test it directly here unless I export it or rely on DOM result.
            // The £60,000 -> £60k test above covers the basic 'k' logic.
            // I'll trust the python script to verify DOM visibility.

            if (originalText.style.display !== 'none') {
                success = false;
                msg.push("Original text not hidden.");
            }

            if (success) {
                statusDiv.textContent = "Success: Budget elements injected and formatted correctly.";
                statusDiv.style.color = "green";
            } else {
                statusDiv.textContent = "Failure: " + msg.join(" ");
                statusDiv.style.color = "red";
            }

        }, 500);
    </script>
</body>
</html>
