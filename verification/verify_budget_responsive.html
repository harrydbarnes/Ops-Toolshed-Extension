<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Responsive Budget</title>
    <link rel="stylesheet" href="../content.css">
    <style>
        body { padding: 20px; }
        .progress-bar { background: blue; width: 50%; }
        .progress-bar span { background: lightblue; width: 100%; display: block; }
    </style>
</head>
<body>
    <h1>Verify Responsive Budget (CSS Variables)</h1>

    <div id="campaign-budget-overview-container">
        <div class="progress-bar" role="progressbar" title="Buy Total: £29,999.99">
            <span></span>
        </div>
        <span class="campaign-budget-overview-value">£60,000</span>
    </div>

    <div id="mo-extracted-actions-toolbar">Toolbar</div>
    <div id="status">Waiting...</div>

    <script>
        window.chrome = {
            runtime: { id: 'mock-id', lastError: null },
            storage: {
                sync: {
                    get: function(keys, callback) {
                        callback({
                            campaignNavStyle: 'new',
                            optimisedNewNavEnabled: true
                        });
                    },
                    set: function(data, callback) { if (callback) callback(); }
                },
                onChanged: { addListener: function(callback) {} }
            }
        };
    </script>
    <script src="../features/campaign.js"></script>

    <script>
        setTimeout(() => {
            console.log("Triggering handleCampaignNavigationOptimisation");
            if (window.campaignFeature && window.campaignFeature.handleCampaignNavigationOptimisation) {
                window.campaignFeature.handleCampaignNavigationOptimisation();
            }

            const val = document.querySelector('.campaign-budget-overview-value');
            if (val) {
                console.log("Value Element Style:", val.getAttribute('style'));
                const prefix = val.style.getPropertyValue('--billable-prefix');
                console.log("Prefix Var:", prefix);
            }

            document.getElementById('status').textContent = "Done";
        }, 500);
    </script>
</body>
</html>
